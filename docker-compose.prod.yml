services:
  front:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: proxicare-front
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      NODE_ENV: production
      BACKEND_URL: http://api:3000
      API_URL: http://api:3000/api
      AUTH0_SECRET: ${AUTH0_SECRET}
      AUTH0_BASE_URL: ${AUTH0_BASE_URL:-https://www.proxicare.ovh}
      AUTH0_ISSUER_BASE_URL: ${AUTH0_ISSUER_BASE_URL}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - proxicare-network

  api:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: proxicare-api
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      DEBUG: "false"
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-proxicare}
      DB_USER: ${DB_USER:-proxicare}
      DB_PASSWORD: ${DB_PASSWORD:-proxicare_password}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      API_CORS: ${API_CORS:-https://www.proxicare.ovh}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - proxicare-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: proxicare-postgres
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-proxicare}
      POSTGRES_USER: ${DB_USER:-proxicare}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-proxicare_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - proxicare-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-proxicare} -d ${DB_NAME:-proxicare}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: proxicare-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - proxicare-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  certbot:
    image: certbot/certbot:latest
    container_name: proxicare-certbot
    profiles:
      - init-ssl
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: >
      certbot certonly
      --webroot
      --webroot-path=/var/www/certbot
      --email ${CERTBOT_EMAIL}
      --agree-tos
      --no-eff-email
      -d ${DOMAIN:-proxicare.ovh}
    networks:
      - proxicare-network

  portainer:
    image: portainer/portainer-ce:latest
    container_name: proxicare-portainer
    restart: unless-stopped
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    networks:
      - proxicare-network

volumes:
  postgres-data:
    name: proxicare-postgres-data
  certbot-conf:
    name: proxicare-certbot-conf
  certbot-www:
    name: proxicare-certbot-www
  portainer-data:
    name: proxicare-portainer-data

networks:
  proxicare-network:
    name: proxicare-network
    driver: bridge
